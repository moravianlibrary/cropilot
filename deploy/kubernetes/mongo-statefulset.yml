apiVersion: v1
kind: Service
metadata:
  name: mongo-db
  labels:
    app.kubernetes.io/name: mongo-db
spec:
  type: ClusterIP
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
  selector:
    app.kubernetes.io/name: mongo-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-db
  labels:
    app.kubernetes.io/name: mongo-db
spec:
  serviceName: mongo-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-db
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongo-db
          image: docker.io/mongo:8.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: mongodb-default-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cropilot-secrets
                  key: MONGODB_PASS
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
