apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      containers:
        - name: worker
          image: local/smart-crop
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - uv
            - run
            - -m
            - app.tasks.worker
          envFrom:
            - configMapRef:
                name: cropilot-api-env
            - secretRef:
                name: cropilot-secrets
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
          volumeMounts:
            - name: scan-data
              mountPath: /scan_data
            - name: models
              mountPath: /models
      volumes:
        - name: scan-data
          persistentVolumeClaim:
            claimName: scan-data
        - name: models
          persistentVolumeClaim:
            claimName: models
